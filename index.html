<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0">

  <title>QuickMark</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 22px 20px;
    }

    .header-inner {
      max-width: 760px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 14px;
      color: #6b7280;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 760px;
      margin: 28px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
    }


    /* =========================
       SUBJECT
    ========================= */

    .field {
      margin-bottom: 28px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #4b5563;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    select:focus {
      outline: none;
      border-color: #111827;
    }


    /* =========================
       ANSWER KEY AREA
    ========================= */

    #answerSection {
      display: none;
    }

    .progress-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-text {
      font-size: 13px;
      color: #6b7280;
      font-weight: 600;
    }

    .progress-bar {
      height: 7px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #111827;
      transition: width 0.2s;
    }


    /* =========================
       QUESTIONS
    ========================= */

    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
    }

    .question {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 5px 0;
      border-bottom: 1px solid #f1f1f1;
    }

    .question-number {
      width: 42px;
      font-weight: 700;
      font-size: 15px;
    }

    .options {
      display: flex;
      gap: 9px;
    }

    .option {
      width: 38px;
      height: 38px;
      border: 2px solid #d1d5db;
      background: white;
      border-radius: 50%;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
      color: #374151;
    }

    .option:hover {
      border-color: #6b7280;
    }

    .option.selected {
      background: #111827;
      border-color: #111827;
      color: white;
      transform: scale(1.05);
    }


    /* =========================
       START BUTTON
    ========================= */

    .start-button {
      width: 100%;
      border: none;
      margin-top: 28px;
      padding: 17px;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .start-button:disabled {
      background: #d1d5db;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 11px;
    }


    /* =========================
       SCAN SCREEN
    ========================= */

    #scanScreen {
      display: none;
    }

    .paper-info {
      background: #f3f4f6;
      padding: 13px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .scan-area {
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      min-height: 330px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 30px;
      background: #fafafa;
    }

    .camera-icon {
      font-size: 54px;
      margin-bottom: 12px;
    }

    .scan-area h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .scan-area p {
      margin: 0;
      color: #6b7280;
      line-height: 1.5;
      font-size: 14px;
    }

    .camera-button {
      margin-top: 22px;
      padding: 15px 28px;
      border: none;
      border-radius: 11px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button {
      width: 100%;
      border: none;
      background: transparent;
      margin-top: 16px;
      color: #6b7280;
      font-size: 14px;
      cursor: pointer;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        margin-top: 16px;
      }

      .card {
        padding: 19px;
      }

      .answer-grid {
        grid-template-columns: 1fr;
      }

      .question {
        justify-content: space-between;
      }

      .option {
        width: 42px;
        height: 42px;
      }

    }

  </style>
</head>


<body>


<!-- HEADER -->

<div class="header">

  <div class="header-inner">

    <div class="logo">
      Q
    </div>

    <div>

      <h1>
        QuickMark
      </h1>

      <p>
        Scan. Spot. Mark.
      </p>

    </div>

  </div>

</div>



<div class="container">


<!-- =========================
     SETUP SCREEN
========================= -->

<div id="setupScreen" class="card">


  <div class="section-title">
    Set Up Answer Key
  </div>


  <!-- SUBJECT -->

  <div class="field">

    <label>
      Subject
    </label>

    <select
      id="subject"
      onchange="subjectChanged()"
    >

      <option value="">
        Select subject
      </option>

      <option value="English">
        English
      </option>

      <option value="Mathematics">
        Mathematics
      </option>

      <option value="Science">
        Science
      </option>

      <option value="Mother Tongue">
        Mother Tongue
      </option>

    </select>

  </div>



  <!-- ANSWER KEY -->

  <div id="answerSection">


    <div class="progress-area">

      <div
        class="section-title"
        style="margin:0;"
      >
        Answer Key
      </div>


      <div
        id="progressText"
        class="progress-text"
      >
      </div>

    </div>



    <div class="progress-bar">

      <div
        id="progressFill"
        class="progress-fill"
      ></div>

    </div>



    <div
      id="answerGrid"
      class="answer-grid"
    ></div>



    <button
      id="startButton"
      class="start-button"
      disabled
      onclick="startScanning()"
    >
      Start Scanning
    </button>


    <div
      id="hint"
      class="hint"
    >
    </div>


  </div>

</div>



<!-- =========================
     SCAN SCREEN
========================= -->

<div
  id="scanScreen"
  class="card"
>


  <div class="section-title">
    Scan Answer Sheet
  </div>


  <div
    id="paperInfo"
    class="paper-info"
  >
  </div>


  <div class="scan-area">


    <div class="camera-icon">
      📷
    </div>


    <h2>
      Ready to Scan
    </h2>


    <p>

      Place the student's answer sheet
      on a flat surface.

      <br><br>

      Make sure the entire answer box
      is visible.

    </p>


    <button
      class="camera-button"
      onclick="openCamera()"
    >
      Open Camera
    </button>


  </div>


  <button
    class="back-button"
    onclick="backToSetup()"
  >
    ← Edit Answer Key
  </button>


</div>


</div>



<script>


/* =========================
   VARIABLES
========================= */

let TOTAL_QUESTIONS = 0;

let answerKey = {};



/* =========================
   SUBJECT SETTINGS
========================= */

function subjectChanged() {


  const subject =
    document.getElementById("subject").value;


  /*
     Number of questions
     depends on subject
  */

  if (subject === "Mathematics") {

    TOTAL_QUESTIONS = 18;

  }

  else if (subject === "English") {

    TOTAL_QUESTIONS = 25;

  }

  else if (subject === "Mother Tongue") {

    TOTAL_QUESTIONS = 25;

  }

  else if (subject === "Science") {

    TOTAL_QUESTIONS = 30;

  }

  else {

    TOTAL_QUESTIONS = 0;

  }



  /*
     Clear previous answers
     whenever subject changes
  */

  answerKey = {};


  const grid =
    document.getElementById("answerGrid");


  grid.innerHTML = "";


  /*
     No subject selected
  */

  if (TOTAL_QUESTIONS === 0) {

    document.getElementById("answerSection")
      .style.display = "none";

    return;

  }



  /*
     Show answer section
  */

  document.getElementById("answerSection")
    .style.display = "block";


  createAnswerGrid();

  updateProgress();

}



/* =========================
   CREATE ANSWER GRID
========================= */

function createAnswerGrid() {


  const grid =
    document.getElementById("answerGrid");


  for (
    let question = 1;
    question <= TOTAL_QUESTIONS;
    question++
  ) {


    const row =
      document.createElement("div");


    row.className = "question";



    /* QUESTION NUMBER */

    const number =
      document.createElement("div");


    number.className =
      "question-number";


    number.textContent =
      "Q" + question;



    /* ANSWER OPTIONS */

    const options =
      document.createElement("div");


    options.className =
      "options";


    for (
      let answer = 1;
      answer <= 4;
      answer++
    ) {


      const button =
        document.createElement("button");


      button.className =
        "option";


      button.textContent =
        answer;


      button.dataset.question =
        question;


      button.dataset.answer =
        answer;



      button.onclick =
        function () {


          selectAnswer(
            question,
            answer,
            button
          );


        };


      options.appendChild(button);

    }



    row.appendChild(number);

    row.appendChild(options);

    grid.appendChild(row);

  }

}



/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(
  question,
  answer,
  clickedButton
) {


  answerKey[question] =
    answer;



  /*
     Remove previous selection
     for this question
  */

  const buttons =
    document.querySelectorAll(
      '.option[data-question="' +
      question +
      '"]'
    );


  buttons.forEach(
    button => {

      button.classList.remove(
        "selected"
      );

    }
  );



  /*
     Select new answer
  */

  clickedButton.classList.add(
    "selected"
  );


  updateProgress();

}



/* =========================
   UPDATE PROGRESS
========================= */

function updateProgress() {


  const completed =
    Object.keys(answerKey).length;



  document.getElementById(
    "progressText"
  ).textContent =

    completed +
    " / " +
    TOTAL_QUESTIONS +
    " completed";



  const percentage =
    TOTAL_QUESTIONS > 0

      ? (completed /
         TOTAL_QUESTIONS) * 100

      : 0;



  document.getElementById(
    "progressFill"
  ).style.width =

    percentage + "%";



  /*
     Enable Start button only
     when every answer is entered
  */

  const complete =
    completed === TOTAL_QUESTIONS;


  document.getElementById(
    "startButton"
  ).disabled = !complete;



  if (complete) {

    document.getElementById(
      "hint"
    ).textContent =
      "Answer key complete. Ready to scan.";

  }

  else {

    const remaining =
      TOTAL_QUESTIONS - completed;


    document.getElementById(
      "hint"
    ).textContent =

      "Complete " +
      remaining +
      " more " +
      (remaining === 1
        ? "answer."
        : "answers.");

  }

}



/* =========================
   START SCANNING
========================= */

function startScanning() {


  const subject =
    document.getElementById(
      "subject"
    ).value;



  document.getElementById(
    "paperInfo"
  ).innerHTML =

    "<strong>" +
    subject +
    "</strong>" +

    " &nbsp;•&nbsp; " +

    TOTAL_QUESTIONS +
    " Questions";



  document.getElementById(
    "setupScreen"
  ).style.display =
    "none";


  document.getElementById(
    "scanScreen"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* =========================
   BACK
========================= */

function backToSetup() {


  document.getElementById(
    "scanScreen"
  ).style.display =
    "none";


  document.getElementById(
    "setupScreen"
  ).style.display =
    "block";

}



/* =========================
   CAMERA
========================= */

function openCamera() {


  /*
     NEXT STAGE:

     Live phone camera

     ↓

     Answer sheet alignment frame

     ↓

     Capture

     ↓

     Detect shaded answers

     ↓

     Compare against answerKey

     ↓

     Flash incorrect question numbers

     ↓

     Teacher physically marks paper

     ↓

     Scan next paper
  */


  alert(
    "Camera will be added in the next stage."
  );

}


</script>


</body>
</html>
